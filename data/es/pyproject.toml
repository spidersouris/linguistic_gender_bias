[project]
name = "es-arroba-nouns"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "cupy-cuda12x>=14.1.1",
    "es-dep-news-trf",
    "nvidia-cublas-cu12>=12.8.4.1",
    "nvidia-cuda-nvrtc-cu12>=12.8.93",
    "nvidia-cuda-runtime-cu12>=12.8.90",
    "nvidia-cufft-cu12>=11.3.3.83",
    "nvidia-curand-cu12>=10.3.9.90",
    "nvidia-cusolver-cu12>=11.7.3.90",
    "nvidia-cusparse-cu12>=12.5.8.93",
    "py3langid>=0.3.0",
    "pyarrow>=25.0.0",
    "spacy[transformers]>=3.8.14",
    "torch>=2.11.0",
]

[tool.uv.sources]
es-dep-news-trf = { url = "https://github.com/explosion/spacy-models/releases/download/es_dep_news_trf-3.8.0/es_dep_news_trf-3.8.0-py3-none-any.whl" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
